events {}

http {
    server {
        listen 8080;

        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://rootagent-backend:8890;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
