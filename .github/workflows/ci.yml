name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.29
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check app tests
        working-directory: backend
      - run: uv run pytest tests --cov=app --cov-report=term-missing --cov-fail-under=80
        working-directory: backend
      - run: uvx --python 3.12 bandit -r app -ll
        working-directory: backend
      - run: uv export --frozen --no-dev --format requirements-txt --output-file /tmp/rootagent-requirements.txt
        working-directory: backend
      - run: uvx --python 3.12 pip-audit -r /tmp/rootagent-requirements.txt

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rootagent
          POSTGRES_PASSWORD: rootagent-test-password
          POSTGRES_DB: rootagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rootagent -d rootagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_USER: rootagent
      POSTGRES_PASSWORD: rootagent-test-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: rootagent
      REDIS_PASSWORD: rootagent-test-password
      MINIO_ACCESS_KEY: rootagent
      MINIO_SECRET_KEY: rootagent-test-password
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-bytes
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.29
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run alembic -c alembic.ini upgrade head
        working-directory: backend
      - name: Assert alembic_version matches head
        working-directory: backend
        run: |
          expected="$(uv run alembic -c alembic.ini heads | awk '{print $1}')"
          actual="$(PGPASSWORD=$POSTGRES_PASSWORD psql -h 127.0.0.1 -U rootagent -d rootagent -tAc 'select version_num from alembic_version')"
          test "$actual" = "$expected"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: cp .env.example .env
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  containers:
    runs-on: ubuntu-latest
    needs: [backend, migration, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: rootagent-backend:local
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: rootagent-frontend:local
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: rootagent-backend:local
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: rootagent-frontend:local
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Start CI dependencies
        run: |
          docker network create infra-network
          docker run -d --name infra-postgres --network infra-network \
            -e POSTGRES_USER=rootagent \
            -e POSTGRES_PASSWORD=rootagent-ci-password \
            -e POSTGRES_DB=rootagent \
            postgres:16-alpine
          docker run -d --name infra-redis --network infra-network \
            redis:7-alpine redis-server --requirepass rootagent-ci-password
          docker run -d --name infra-minio --network infra-network \
            -e MINIO_ROOT_USER=rootagent \
            -e MINIO_ROOT_PASSWORD=rootagent-ci-password \
            minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          timeout 60 sh -c 'until docker exec infra-postgres pg_isready -U rootagent -d rootagent; do sleep 1; done'
          cp .github/ci/backend.env backend/.env
      - name: Compose readiness smoke test
        run: |
          docker compose up -d --no-build
          timeout 120 sh -c 'until curl -fsS http://127.0.0.1:8890/health/ready; do sleep 2; done'
      - name: Central proxy WebSocket smoke test
        run: |
          docker run -d --name rootagent-ci-proxy --network infra-network \
            -p 127.0.0.1:18080:8080 \
            -v "$PWD/.github/ci/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
          uv run --project backend python "$GITHUB_WORKSPACE/.github/ci/ws_smoke.py"
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color
